version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mcp-server:
    build: ./mcp-server
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./mcp-server/chroma_data:/app/chroma_data

volumes:
  redis_data: